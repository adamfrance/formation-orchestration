# La chaîne d'intégration continue de Ruée (GitHub Actions). À chaque modification :
#   1. elle teste le code ;
#   2. elle construit l'image de chaque brique, pour deux architectures, avec son inventaire (SBOM) et sa provenance ;
#   3. elle l'analyse avec Trivy : une faille grave arrête tout ;
#   4. elle la signe avec cosign, sans clé à garder (l'identité de la chaîne fait foi).
# Le cluster n'accepte que les images signées par cette chaîne (jour 3).
# Chaque action est épinglée par son empreinte de commit : une étiquette (v7) peut être déplacée par un attaquant,
# une empreinte non (attaque de tj-actions/changed-files, mars 2025).
name: images

on:
  push:
    branches: [main]
  pull_request: # une proposition de modification : on teste et on construit, sans rien publier

permissions:
  contents: read # par défaut, la chaîne ne peut que lire le dépôt

jobs:
  tester:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # la version de Go du projet
      - run: go vet ./... # les erreurs courantes repérées par le compilateur
      - run: go test ./... # les tests

  images:
    needs: tester # seulement si les tests passent
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publier dans le registre de GitHub (ghcr.io)
      id-token: write # obtenir l'identité de la chaîne, qui sert à signer sans clé
    strategy:
      matrix: # la même suite d'étapes, une fois par brique, en parallèle
        service: [salle-attente, vente, paiement, billets]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ruee-${{ matrix.service }}
      PUBLIER: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLIER == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # jeton temporaire fourni par GitHub, valable le temps de la chaîne

      - name: Construire (et publier sur main)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }} # l'étiquette = le commit : on sait toujours d'où vient l'image
          push: ${{ env.PUBLIER == 'true' }}
          sbom: true # l'inventaire des composants, joint à l'image
          provenance: mode=max # comment, où et à partir de quoi l'image a été construite

      - name: Analyser (une faille grave arrête la chaîne)
        if: env.PUBLIER == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # seulement les failles qui ont déjà un correctif
          exit-code: "1"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLIER == 'true'
      - name: Signer (par l'empreinte, jamais par l'étiquette)
        if: env.PUBLIER == 'true'
        run: cosign sign --yes "$IMAGE@${{ steps.image.outputs.digest }}"
