# Le cluster des démonstrations : un plan de contrôle et deux nœuds de travail, chacun dans un conteneur Docker
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: formation
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # le port de la passerelle HTTP sur les nœuds
        hostPort: 8080       # devient http://localhost:8080 sur le poste
        listenAddress: "127.0.0.1" # sur l'adresse locale seulement : invisible du réseau de la salle
  - role: worker
  - role: worker
